<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Tuition Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --badge-bg: #3b82f6;
        }

        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            height: 96vh;
            max-height: 680px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.15rem;
            margin: 0;
            color: var(--primary);
        }

        .stats-container {
            display: flex;
            gap: 6px;
        }

        .stats {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: var(--bg-color);
            padding: 3px 6px;
            border-radius: 6px;
            font-weight: 500;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .calendar-nav button {
            background: none;
            border: 1px solid var(--border);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .calendar-nav button:hover {
            background: var(--bg-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            flex: 1;
            min-height: 0;
        }

        .day-cell {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            padding: 3px;
            cursor: pointer;
            transition: all 0.2s;
            overflow: hidden;
            min-height: 0;
        }

        .day-cell:hover {
            border-color: var(--primary);
            background-color: #faf5ff;
        }

        .day-cell.empty {
            border: none;
            background: transparent;
            cursor: default;
        }

        .day-number {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .day-cell.today {
            border-color: var(--primary);
            background-color: #eef2ff;
        }

        .time-entries-preview {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .time-badge {
            font-size: 0.6rem;
            background: var(--badge-bg);
            color: white;
            border-radius: 3px;
            padding: 1px 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .class-input-group {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 6px;
            background: var(--bg-color);
            padding: 5px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .class-input-group input[type="text"] {
            flex: 1;
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8rem;
        }

        .class-input-group button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 3px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .config-field {
            margin-bottom: 8px;
        }

        .config-field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 2px;
            color: var(--text-muted);
        }

        .config-field input {
            width: 100%;
            padding: 5px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.8rem;
            box-sizing: border-box;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            font-size: 0.85rem;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text-main);
            margin-top: 5px;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .actions-bar {
            margin-top: 6px;
            display: flex;
            gap: 6px;
            border-top: 1px solid var(--border);
            padding-top: 6px;
        }

        .actions-bar button {
            flex: 1;
            padding: 5px;
            font-size: 0.75rem;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Math Tuition Tracker</h1>
            <div class="stats-container">
                <div class="stats" id="monthStats">Month: 0</div>
                <div class="stats" id="totalStats">Total: 0</div>
            </div>
        </header>

        <div class="calendar-nav">
            <button id="prevMonth">&larr; Prev</button>
            <h2 id="monthYearDisplay" style="margin: 0; font-size: 0.95rem;"></h2>
            <button id="nextMonth">Next &rarr;</button>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div class="days-grid" id="daysGrid"></div>

        <div class="actions-bar">
            <button class="btn btn-secondary" onclick="exportData()">Backup</button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Restore</button>
            <button class="btn btn-secondary" onclick="openConfigModal()">⚙️ Config</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <!-- Modal for adding/editing time slots -->
    <div class="modal" id="classModal">
        <div class="modal-content">
            <div class="modal-title" id="modalDateTitle">Math Classes</div>
            <div id="classListContainer" style="max-height: 140px; overflow-y: auto; margin-bottom: 6px;"></div>
            
            <button class="btn btn-secondary" onclick="addClassInput('')">+ Add Class Slot</button>
            <button class="btn" onclick="saveDayClasses()">Confirm & Save</button>
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <!-- Modal for Telegram Config -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <div class="modal-title">Telegram Cloud Settings</div>
            <div class="config-field">
                <label>Bot Token:</label>
                <input type="text" id="botTokenInput" placeholder="e.g. 123456789:ABCdef...">
            </div>
            <div class="config-field">
                <label>Chat ID:</label>
                <input type="text" id="chatIdInput" placeholder="e.g. 987654321">
            </div>
            <button class="btn" onclick="saveConfig()">Save Config</button>
            <button class="btn btn-secondary" onclick="closeConfigModal()">Cancel</button>
        </div>
    </div>

    <script>
        let tuitionData = JSON.parse(localStorage.getItem('tuitionData')) || {};
        let telegramConfig = JSON.parse(localStorage.getItem('telegramConfig')) || { token: '', chatId: '' };
        
        let currentDate = new Date();
        let selectedDateKey = '';

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function initCalendar() {
            renderCalendar();
            updateStats();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    cell.classList.add('today');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.innerText = day;
                cell.appendChild(dayNumber);

                const classes = tuitionData[dateKey] || [];
                if (classes.length > 0) {
                    const previewContainer = document.createElement('div');
                    previewContainer.className = 'time-entries-preview';
                    
                    classes.forEach(timeText => {
                        const badge = document.createElement('div');
                        badge.className = 'time-badge';
                        badge.innerText = timeText.trim() !== '' ? timeText : 'Class';
                        previewContainer.appendChild(badge);
                    });
                    cell.appendChild(previewContainer);
                }

                cell.onclick = () => openModal(dateKey);
                grid.appendChild(cell);
            }
        }

        function openModal(dateKey) {
            selectedDateKey = dateKey;
            document.getElementById('modalDateTitle').innerText = `Math Classes: ${dateKey}`;
            
            const container = document.getElementById('classListContainer');
            container.innerHTML = '';

            const existingClasses = tuitionData[dateKey] || [];
            
            if (existingClasses.length === 0) {
                addClassInput('');
            } else {
                existingClasses.forEach(timeText => addClassInput(timeText));
            }

            document.getElementById('classModal').classList.add('active');
        }

        function addClassInput(timeText = '') {
            const container = document.getElementById('classListContainer');
            const group = document.createElement('div');
            group.className = 'class-input-group';
            
            group.innerHTML = `
                <span>Time:</span> 
                <input type="text" value="${timeText}" placeholder="e.g. 4-5 PM" class="timeInput">
                <button onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(group);
        }

        function saveDayClasses() {
            const container = document.getElementById('classListContainer');
            const inputs = container.querySelectorAll('.timeInput');
            const classes = [];

            inputs.forEach(input => {
                classes.push(input.value);
            });

            const hasActualData = classes.some(val => val.trim() !== '');

            if (classes.length > 0 && hasActualData) {
                tuitionData[selectedDateKey] = classes;
            } else {
                delete tuitionData[selectedDateKey];
            }

            localStorage.setItem('tuitionData', JSON.stringify(tuitionData));

            // Sync with Telegram if configured
            sendToTelegram(selectedDateKey, classes);

            closeModal();
            renderCalendar();
            updateStats();
        }

        function closeModal() {
            document.getElementById('classModal').classList.remove('active');
        }

        // Telegram Integration Function
        function sendToTelegram(date, classes) {
            if (!telegramConfig.token || !telegramConfig.chatId) return;

            const classSummary = classes.filter(c => c.trim() !== '').join(', ') || 'No time specified';
            const message = `📚 Math Tuition Saved!\n📅 Date: ${date}\n⏰ Classes: ${classSummary}`;

            const url = `https://api.telegram.org/bot${telegramConfig.token}/sendMessage`;
            
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: telegramConfig.chatId,
                    text: message
                })
            }).catch(err => console.error('Telegram sync error:', err));
        }

        function openConfigModal() {
            document.getElementById('botTokenInput').value = telegramConfig.token;
            document.getElementById('chatIdInput').value = telegramConfig.chatId;
            document.getElementById('configModal').classList.add('active');
        }

        function closeConfigModal() {
            document.getElementById('configModal').classList.remove('active');
        }

        function saveConfig() {
            const token = document.getElementById('botTokenInput').value.trim();
            const chatId = document.getElementById('chatIdInput').value.trim();
            
            telegramConfig = { token, chatId };
            localStorage.setItem('telegramConfig', JSON.stringify(telegramConfig));
            
            closeConfigModal();
            alert('Telegram config saved successfully!');
        }

        function updateStats() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;

            let monthTotal = 0;
            let grandTotal = 0;

            Object.keys(tuitionData).forEach(dateKey => {
                const count = tuitionData[dateKey].length;
                grandTotal += count;
                if (dateKey.startsWith(monthPrefix)) {
                    monthTotal += count;
                }
            });

            document.getElementById('monthStats').innerText = `Month: ${monthTotal}`;
            document.getElementById('totalStats').innerText = `Total: ${grandTotal}`;
        }

        document.getElementById('prevMonth').onclick = () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
            updateStats();
        };

        document.getElementById('nextMonth').onclick = () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
            updateStats();
        };

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tuitionData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "tuition_tracker_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    tuitionData = JSON.parse(e.target.result);
                    localStorage.setItem('tuitionData', JSON.stringify(tuitionData));
                    renderCalendar();
                    updateStats();
                    alert('Data restored successfully!');
                } catch (err) {
                    alert('Invalid backup file.');
                }
            };
            reader.readAsText(file);
        }

        initCalendar();
    </script>
</body>
</html>
