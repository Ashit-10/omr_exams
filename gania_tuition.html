<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuition Class Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: var(--primary);
        }

        .stats {
            font-size: 0.9rem;
            color: var(--text-muted);
            background: var(--bg-color);
            padding: 6px 12px;
            border-radius: 8px;
        }

        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .calendar-nav button {
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .calendar-nav button:hover {
            background: var(--bg-color);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-cell {
            aspect-ratio: 1;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .day-cell:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        .day-cell.empty {
            border: none;
            background: transparent;
            cursor: default;
        }

        .day-number {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .day-cell.today {
            border-color: var(--primary);
            font-weight: bold;
        }

        .class-dots {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
            max-height: 18px;
            overflow: hidden;
        }

        .class-dot {
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
        }

        .class-count-badge {
            font-size: 0.65rem;
            background: var(--primary);
            color: white;
            border-radius: 4px;
            padding: 1px 4px;
            align-self: flex-start;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .class-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .class-input-group input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .class-input-group button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--text-main);
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .actions-bar {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tuition Tracker</h1>
            <div class="stats" id="totalStats">Total Classes: 0</div>
        </header>

        <div class="calendar-nav">
            <button id="prevMonth">&larr; Prev</button>
            <h2 id="monthYearDisplay" style="margin: 0; font-size: 1.1rem;"></h2>
            <button id="nextMonth">Next &rarr;</button>
        </div>

        <div class="weekdays">
            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>

        <div class="days-grid" id="daysGrid"></div>

        <div class="actions-bar">
            <button class="btn btn-secondary" onclick="exportData()">Backup Data</button>
            <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Restore Data</button>
            <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <!-- Modal for adding/editing classes -->
    <div class="modal" id="classModal">
        <div class="modal-content">
            <div class="modal-title" id="modalDateTitle">Manage Classes</div>
            <div id="classListContainer"></div>
            
            <button class="btn btn-secondary" onclick="addClassInput()" style="margin-bottom: 12px;">+ Add Another Class</button>
            <button class="btn" onclick="saveDayClasses()">Confirm & Save</button>
            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Load data permanently from localStorage or start fresh
        let tuitionData = JSON.parse(localStorage.getItem('tuitionData')) || {};
        
        let currentDate = new Date();
        let selectedDateKey = '';

        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function initCalendar() {
            renderCalendar();
            updateStats();
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthYearDisplay').innerText = `${monthNames[month]} ${year}`;

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            const grid = document.getElementById('daysGrid');
            grid.innerHTML = '';

            // Blank spaces for previous month overflow
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = 'day-cell empty';
                grid.appendChild(emptyCell);
            }

            // Days of the current month
            const today = new Date();
            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';

                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    cell.classList.add('today');
                }

                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.innerText = day;
                cell.appendChild(dayNumber);

                // Check if classes exist for this date
                if (tuitionData[dateKey] && tuitionData[dateKey].length > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'class-count-badge';
                    badge.innerText = `${tuitionData[dateKey].length} class${tuitionData[dateKey].length > 1 ? 'es' : ''}`;
                    cell.appendChild(badge);
                }

                cell.onclick = () => openModal(dateKey);
                grid.appendChild(cell);
            }
        }

        function openModal(dateKey) {
            selectedDateKey = dateKey;
            document.getElementById('modalDateTitle').innerText = `Classes for ${dateKey}`;
            
            const container = document.getElementById('classListContainer');
            container.innerHTML = '';

            const existingClasses = tuitionData[dateKey] || [];
            
            if (existingClasses.length === 0) {
                // Default to empty input row or pre-populate if you want
                addClassInput('');
            } else {
                existingClasses.forEach(className => addClassInput(className));
            }

            document.getElementById('classModal').classList.add('active');
        }

        function addClassInput(value = '') {
            const container = document.getElementById('classListContainer');
            const group = document.createElement('div');
            group.className = 'class-input-group';
            
            group.innerHTML = `
                <input type="text" placeholder="e.g. Physics / Math Batch" value="${value}">
                <button onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(group);
        }

        function saveDayClasses() {
            const container = document.getElementById('classListContainer');
            const inputs = container.querySelectorAll('input');
            const classes = [];

            inputs.forEach(input => {
                const val = input.value.trim();
                if (val !== '') {
                    classes.push(val);
                }
            });

            if (classes.length > 0) {
                tuitionData[selectedDateKey] = classes;
            } else {
                delete tuitionData[selectedDateKey]; // Clean up if empty
            }

            // Save permanently to browser storage
            localStorage.setItem('tuitionData', JSON.stringify(tuitionData));

            closeModal();
            renderCalendar();
            updateStats();
        }

        function closeModal() {
            document.getElementById('classModal').classList.remove('active');
        }

        function updateStats() {
            let total = 0;
            Object.values(tuitionData).forEach(classList => {
                total += classList.length;
            });
            document.getElementById('totalStats').innerText = `Total Classes Logged: ${total}`;
        }

        // Navigation
        document.getElementById('prevMonth').onclick = () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        };

        document.getElementById('nextMonth').onclick = () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        };

        // Backup / Export feature
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(tuitionData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "tuition_tracker_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // Restore / Import feature
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    tuitionData = JSON.parse(e.target.result);
                    localStorage.setItem('tuitionData', JSON.stringify(tuitionData));
                    renderCalendar();
                    updateStats();
                    alert('Data restored successfully!');
                } catch (err) {
                    alert('Invalid backup file.');
                }
            };
            reader.readAsText(file);
        }

        // Initialize on load
        initCalendar();
    </script>
</body>
</html>
