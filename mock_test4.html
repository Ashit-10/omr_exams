<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Test System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <style>
        body {
            font-family: "Noto Sans Odia", "Nirmala UI", "Kalinga", sans-serif;
            background-color: #fff;
            color: #0a0a0a;
            margin: 0;
            padding: 0px;
            box-sizing: border-box;
        }

        .test-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            margin: 0 auto;
            overflow-y: auto;
            position: relative;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .exam-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .question-box {
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: #fafafa;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s;
        }

        .question-box:nth-child(odd) {
            box-shadow: 0 4px 8px rgba(255, 0, 0, 0.5);
        }

        .question-box:nth-child(even) {
            box-shadow: 0 4px 8px rgba(0, 0, 255, 0.5);
        }

        .question-number {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .question {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .options {
            list-style-type: none;
            padding: 0;
        }

        .options li {
            margin-bottom: 15px;
        }

        .option-label {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ddd;
            background-color: #fff;
            transition: background-color 0.3s, border-color 0.3s;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            text-align: left;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .options input[type="radio"] {
            display: none;
        }

        .options input[type="radio"]:checked + .option-label {
            background-color: #0d6efd;
            color: white;
            border-color: #0b5ed7;
        }

        #score-banner {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #notification {
            position: fixed;
            top: 30%;
            left: 40%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 4px;
            color: #fff;
            display: none;
            font-weight: bold;
            animation: blast 1.5s forwards;
        }

        #notification.correct {
            background-color: #64b966;
        }

        #notification.incorrect {
            top: 40%;
            background-color: #d85555;
        }

        @keyframes blast {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(1.5);
            }
        }

        #questions-left {
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #floating-circle {
            position: fixed;
            top: 20%;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        #end-exam-button {
            position: fixed;
            top: 30%;
            right: 20px;
            width: 60px;
            height: 40px;
            border-radius: 8px;
            background-color: #28a745;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            line-height: 40px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border: none;
            z-index: 1000;
        }

        #end-exam-button:disabled {
            background-color: #888;
            cursor: not-allowed;
        }

        .exam-end-message {
            text-align: center;
            padding: 25px;
            margin-top: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
    </style>

</head>

<body>

    <div class="test-container">

        <h1>Online Test System</h1>

        <div id="headname" class="exam-name">Mock Test</div>

        <div class="status-bar">

            <div id="score-banner">Score: 0 / 0</div>

            <div id="questions-left">Questions Left: 0</div>

        </div>

        <div id="questions-container">
            <!-- Questions will be dynamically loaded here -->
        </div>

        <div id="notification"></div>

        <div id="floating-circle"></div>

        <button id="end-exam-button" onclick="endExam()">End</button>

    </div>


<script>

// =============================================
// TELEGRAM CONFIGURATION
// REPLACE THESE TWO VALUES
// =============================================

const botToken = "2113644798:AAGgYmlbmCf665R2o8xg_E8CAEXuMo90TKo";

const chatId = "-1001417526920";


// =============================================
// STUDENT NAME MANAGEMENT
// =============================================

let studentName = localStorage.getItem("studentName");

if (!studentName || studentName.trim() === "") {

    while (!studentName || studentName.trim() === "") {

        studentName = prompt("Please enter your name:");

        if (studentName === null) {
            alert("Name is required to continue.");
            studentName = "";
        }

        studentName = studentName.trim();

    }

    localStorage.setItem("studentName", studentName);

}


// =============================================
// GET QUERY PARAMETERS
// =============================================

const urlParams = new URLSearchParams(window.location.search);

const fileLoc = urlParams.get('file');

const examFile = urlParams.get('exam');

let questionsFile;

let answersFile;


if (examFile) {

    questionsFile = fileLoc + `_question.txt`;

    answersFile = fileLoc + `_ans_key.txt`;

} else {

    console.log("else");

    questionsFile = fileLoc + `/question.txt`;

    answersFile = fileLoc + `/answer.txt`;

}


let subjectName = urlParams.get('subject');

const shuffleQuestions = urlParams.get('shuffle') === 'true';


if (subjectName) {
    subjectName = subjectName;
} else {
    subjectName = "Mock Test";
}


let headName = document.getElementById('headname');

headName.textContent = subjectName;


// =============================================
// VARIABLES
// =============================================

let questions = [];

let score = 0;

let studentAnswers = [];

let examEnded = false;

let finalReport = null;

const floatingCircle = document.getElementById('floating-circle');


// =============================================
// SHUFFLE ARRAY
// =============================================

function shuffleArray(array) {

    for (let i = array.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];

    }

}


// =============================================
// TELEGRAM DIRECT API FUNCTION
// =============================================

async function sendTelegramMessage(message) {

    const telegramURL = `https://api.telegram.org/bot${botToken}/sendMessage`;

    const response = await fetch(telegramURL, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            chat_id: chatId,

            text: message

        })

    });


    const result = await response.json();


    if (!response.ok || !result.ok) {

        throw new Error(result.description || "Telegram message failed.");

    }


    return result;

}


// =============================================
// TELEGRAM PAGE OPEN NOTIFICATION
// =============================================

async function notifyPageOpened() {

    try {

        const message =

            `🟢 TEST PAGE OPENED\n\n` +

            `👤 Student: ${studentName}\n` +

            `📚 Subject: ${subjectName}\n\n` +

            `🔗 Page: ${window.location.href}\n\n` +

            `🕒 Time: ${new Date().toLocaleString()}`;


        await sendTelegramMessage(message);


        console.log("Page opening notification sent.");

    }

    catch (error) {

        console.warn("Page notification error:", error);

    }

}


// Send notification whenever someone opens the page.

notifyPageOpened();


// =============================================
// LOAD QUESTIONS AND ANSWERS
// =============================================

function loadQuestionsAndAnswers() {

    Promise.all([

        fetch(questionsFile).then(response => {

            if (!response.ok) {
                throw new Error("Question file not found");
            }

            return response.text();

        }),

        fetch(answersFile).then(response => {

            if (!response.ok) {
                throw new Error("Answer file not found");
            }

            return response.json();

        })

    ])

    .then(([questionsText, answersJson]) => {

        const lines = questionsText.split('\n').filter(line => line.trim() !== '');

        let questionList = [];

        let currentQuestion = {};


        lines.forEach(line => {

            if (line.match(/^\d+\./)) {

                if (currentQuestion.question) {
                    questionList.push(currentQuestion);
                }

                currentQuestion = {

                    question: line.replace(/^\d+\.\s*/, ""),

                    options: []

                };

            }

            else if (line.match(/^[A-D]\)/)) {

                const optionText = line.replace(/^[A-D]\)\s*/, "");

                currentQuestion.options.push(optionText);

            }

        });


        if (currentQuestion.question) {
            questionList.push(currentQuestion);
        }


        // Combine questions with corresponding answers.

        questions = questionList.map((q, index) => {

            const correctAnswers = answersJson[index + 1];

            const correctAnswerArray = Array.isArray(correctAnswers)
                ? correctAnswers
                : [correctAnswers];


            let optionsWithIndex = q.options.map((opt, i) => ({

                opt,

                originalIndex: i

            }));


            // Shuffle options.

            if (shuffleQuestions) {
                shuffleArray(optionsWithIndex);
            }


            const shuffledOptions = optionsWithIndex.map(optObj => optObj.opt);


            // Map correct answers to shuffled indices.

            const correctIndices = correctAnswerArray.map(correctAnswer => {

                const originalIndex = correctAnswer.charCodeAt(0) - 'A'.charCodeAt(0);

                return optionsWithIndex.findIndex(optObj =>
                    optObj.originalIndex === originalIndex
                );

            }).filter(index => index >= 0);


            return {

                question: q.question,

                options: shuffledOptions,

                correctAnswerIndices: correctIndices

            };

        });


        // Shuffle questions.

        if (shuffleQuestions) {
            shuffleArray(questions);
        }


        // Initialize answer tracking.

        studentAnswers = questions.map(() => ({

            selectedIndex: null,

            isCorrect: null

        }));


        displayQuestions();

    })

    .catch(error => {

        console.error("Error loading questions or answers:", error);

        document.getElementById('questions-container').innerHTML =

            `<p class="text-danger">Error loading questions or answers.</p>`;

    });

}


// =============================================
// HANDLE OPTION CHANGE
// =============================================

function handleOptionChange(questionIndex, selectedOptionIndex, selectedRadio) {

    if (examEnded) return;


    floatingCircle.style.display = 'flex';


    const correctOptionIndices = questions[questionIndex].correctAnswerIndices;

    const selectedOptionLabel = selectedRadio.parentElement;


    const isCorrect = correctOptionIndices.includes(selectedOptionIndex);


    // Store student's answer.

    studentAnswers[questionIndex] = {

        selectedIndex: selectedOptionIndex,

        isCorrect: isCorrect

    };


    const correctOptions = Array.from(

        document.querySelectorAll(`input[name="question-${questionIndex}"]`)

    ).filter((_, index) => correctOptionIndices.includes(index));


    const correctOptionLabels = correctOptions.map(option => option.parentElement);


    // Disable all radio buttons.

    document.querySelectorAll(`input[name="question-${questionIndex}"]`).forEach(radio => {

        radio.disabled = true;

    });


    if (isCorrect) {

        showNotification('Correct', 'correct');

        selectedOptionLabel.style.backgroundColor = '#5db160';

        correctOptionLabels.forEach(label => {

            label.style.backgroundColor = '#5db160';

        });

        score++;

    }

    else {

        showNotification('Incorrect', 'incorrect');

        selectedOptionLabel.style.backgroundColor = '#f4a5a5';

        correctOptionLabels.forEach(label => {

            label.style.backgroundColor = '#5db160';

        });

    }


    updateUI();

}


// =============================================
// DISPLAY QUESTIONS
// =============================================

function displayQuestions() {

    const container = document.getElementById('questions-container');

    container.innerHTML = '';


    questions.forEach((q, index) => {

        const questionBox = document.createElement('div');

        questionBox.classList.add('question-box');


        const questionNumber = document.createElement('div');

        questionNumber.classList.add('question-number');

        questionNumber.textContent = `Question ${index + 1}`;


        const questionText = document.createElement('div');

        questionText.classList.add('question');

        questionText.innerHTML = q.question;


        const optionsList = document.createElement('ul');

        optionsList.classList.add('options');


        q.options.forEach((opt, optIndex) => {

            const optionItem = document.createElement('li');

            const label = document.createElement('label');

            const radio = document.createElement('input');


            radio.type = 'radio';

            radio.name = `question-${index}`;

            radio.value = String.fromCharCode(65 + optIndex);


            radio.addEventListener('change', () => {

                handleOptionChange(index, optIndex, radio);

            });


            label.classList.add('option-label');

            label.appendChild(radio);


            const optionLabel = document.createElement('span');

            optionLabel.textContent = `${String.fromCharCode(65 + optIndex)}) `;

            optionLabel.style.display = 'inline-block';

            optionLabel.style.marginRight = '5px';


            const optionContent = document.createElement('span');

            optionContent.innerHTML = opt;


            label.style.display = 'flex';

            label.style.alignItems = 'flex-start';

            label.style.flexWrap = 'wrap';


            label.appendChild(optionLabel);

            label.appendChild(optionContent);


            optionItem.appendChild(label);

            optionsList.appendChild(optionItem);

        });


        questionBox.appendChild(questionNumber);

        questionBox.appendChild(questionText);

        questionBox.appendChild(optionsList);

        container.appendChild(questionBox);

    });


    updateUI();

}


// =============================================
// UPDATE UI
// =============================================

function updateUI() {

    document.getElementById('score-banner').textContent =

        `Score: ${score} / ${questions.length}`;


    const questionsLeft = questions.length - getAnsweredQuestionsCount();


    document.getElementById('questions-left').textContent =

        `Questions Left: ${questionsLeft}`;


    floatingCircle.textContent = `${score}`;

}


// =============================================
// GET ANSWERED QUESTIONS COUNT
// =============================================

function getAnsweredQuestionsCount() {

    return studentAnswers.filter(answer =>

        answer.selectedIndex !== null

    ).length;

}


// =============================================
// NOTIFICATION
// =============================================

function showNotification(message, type) {

    const notification = document.getElementById('notification');

    notification.textContent = message;

    notification.className = type;

    notification.style.display = 'block';


    setTimeout(() => {

        notification.style.display = 'none';

    }, 1000);

}


// =============================================
// GENERATE COMPLETE TEST REPORT
// =============================================

function generateTestReport() {

    let correctCount = 0;

    let wrongCount = 0;

    let unansweredCount = 0;


    const questionDetails = questions.map((q, index) => {

        const answer = studentAnswers[index];

        const selectedIndex = answer.selectedIndex;


        const correctAnswers = q.correctAnswerIndices.map(i => ({

            label: String.fromCharCode(65 + i),

            text: q.options[i]

        }));


        let selectedAnswer = null;


        if (selectedIndex !== null) {

            selectedAnswer = {

                label: String.fromCharCode(65 + selectedIndex),

                text: q.options[selectedIndex]

            };

        }


        if (selectedIndex === null) {

            unansweredCount++;

        }

        else if (answer.isCorrect) {

            correctCount++;

        }

        else {

            wrongCount++;

        }


        return {

            questionNumber: index + 1,

            question: q.question,

            options: q.options.map((option, optionIndex) => ({

                label: String.fromCharCode(65 + optionIndex),

                text: option

            })),

            selectedAnswer: selectedAnswer,

            correctAnswers: correctAnswers,

            status: selectedIndex === null

                ? "UNANSWERED"

                : answer.isCorrect

                    ? "CORRECT"

                    : "WRONG"

        };

    });


    const accuracy = questions.length > 0

        ? ((correctCount / questions.length) * 100).toFixed(2)

        : "0.00";


    return {

        event: "test_result",

        studentName: studentName,

        subject: subjectName,

        page: window.location.href,

        date: new Date().toLocaleString(),

        totalQuestions: questions.length,

        answered: correctCount + wrongCount,

        correct: correctCount,

        wrong: wrongCount,

        unanswered: unansweredCount,

        score: correctCount,

        accuracy: accuracy,

        questions: questionDetails

    };

}


// =============================================
// REMOVE HTML TAGS FOR TELEGRAM REPORT
// =============================================

function cleanReportText(text) {

    const element = document.createElement("div");

    element.innerHTML = String(text);

    return element.textContent || element.innerText || "";

}


// =============================================
// CONVERT COMPLETE REPORT INTO TELEGRAM MESSAGES
// =============================================

function createTelegramReportMessages(report) {

    const messages = [];

    const maxLength = 3800;


    // Summary message.

    let summary =

        `📋 TEST RESULT REPORT\n\n` +

        `👤 Student: ${report.studentName}\n` +

        `📚 Subject: ${report.subject}\n` +

        `🕒 Date: ${report.date}\n` +

        `🔗 Page: ${report.page}\n\n` +

        `━━━━━━━━━━━━━━━━━━\n` +

        `📊 FINAL SUMMARY\n` +

        `━━━━━━━━━━━━━━━━━━\n\n` +

        `Total Questions: ${report.totalQuestions}\n` +

        `Attempted: ${report.answered}\n` +

        `Correct: ${report.correct}\n` +

        `Wrong: ${report.wrong}\n` +

        `Unanswered: ${report.unanswered}\n\n` +

        `🏆 Score: ${report.score} / ${report.totalQuestions}\n` +

        `🎯 Accuracy: ${report.accuracy}%\n\n` +

        `━━━━━━━━━━━━━━━━━━\n` +

        `📝 COMPLETE QUESTION REPORT\n`;


    messages.push(summary);


    // Add every question with all options and answers.

    report.questions.forEach(q => {

        let questionMessage =

            `\n━━━━━━━━━━━━━━━━━━\n` +

            `Question ${q.questionNumber}\n` +

            `${cleanReportText(q.question)}\n\n`;


        q.options.forEach(option => {

            questionMessage +=

                `${option.label}) ${cleanReportText(option.text)}\n`;

        });


        questionMessage += "\n";


        if (q.selectedAnswer) {

            questionMessage +=

                `Student Answer: ${q.selectedAnswer.label}) ` +

                `${cleanReportText(q.selectedAnswer.text)}\n`;

        } else {

            questionMessage += `Student Answer: NOT ATTEMPTED\n`;

        }


        questionMessage +=

            `Correct Answer: ` +

            q.correctAnswers.map(answer =>

                `${answer.label}) ${cleanReportText(answer.text)}`

            ).join(", ") +

            `\n`;


        questionMessage +=

            `Status: ${q.status}\n`;


        messages.push(questionMessage);

    });


    // Combine messages while keeping each below Telegram's limit.

    const finalMessages = [];

    let currentMessage = "";


    messages.forEach(message => {

        if (message.length > maxLength) {

            if (currentMessage) {

                finalMessages.push(currentMessage);

                currentMessage = "";

            }


            // Split exceptionally long individual question messages.

            for (let i = 0; i < message.length; i += maxLength) {

                finalMessages.push(message.substring(i, i + maxLength));

            }

        }

        else if ((currentMessage + message).length > maxLength) {

            finalMessages.push(currentMessage);

            currentMessage = message;

        }

        else {

            currentMessage += message;

        }

    });


    if (currentMessage) {

        finalMessages.push(currentMessage);

    }


    // Add message numbering.

    return finalMessages.map((message, index) => {

        return `Part ${index + 1}/${finalMessages.length}\n\n${message}`;

    });

}


// =============================================
// SEND COMPLETE REPORT DIRECTLY TO TELEGRAM
// =============================================

async function sendToTelegram(report) {

    const messages = createTelegramReportMessages(report);


    // Send messages one by one to avoid rate issues.

    for (const message of messages) {

        await sendTelegramMessage(message);

        // Small delay between messages.

        await new Promise(resolve => setTimeout(resolve, 300));

    }


    return true;

}


// =============================================
// END EXAM
// NO CONFIRMATION POPUP
// =============================================

async function endExam() {

    if (examEnded) return;


    if (questions.length === 0) return;


    // Immediately end the exam.

    examEnded = true;


    const endButton = document.getElementById('end-exam-button');

    endButton.disabled = true;

    endButton.textContent = "Sending";


    // Generate complete report.

    finalReport = generateTestReport();


    const container = document.getElementById('questions-container');


    // Display final result.

    container.innerHTML = `

        <div class="exam-end-message">

            <h2>Exam Completed</h2>

            <p><strong>Student Name:</strong> ${escapeHTML(studentName)}</p>

            <p><strong>Subject:</strong> ${escapeHTML(subjectName)}</p>

            <hr>

            <p><strong>Total Questions:</strong> ${finalReport.totalQuestions}</p>

            <p><strong>Correct Answers:</strong> ${finalReport.correct}</p>

            <p><strong>Wrong Answers:</strong> ${finalReport.wrong}</p>

            <p><strong>Unanswered:</strong> ${finalReport.unanswered}</p>

            <hr>

            <h3>Final Score: ${finalReport.score} / ${finalReport.totalQuestions}</h3>

            <h4>Accuracy: ${finalReport.accuracy}%</h4>

            <p id="telegram-status"></p>

        </div>

    `;


    // Send report immediately.

    await submitFinalReport();

}


// =============================================
// SUBMIT FINAL REPORT
// =============================================

async function submitFinalReport() {

    const endButton = document.getElementById('end-exam-button');

    const status = document.getElementById('telegram-status');


    try {

        await sendToTelegram(finalReport);


        status.textContent = "✓ Result sent successfully";

        status.style.color = "#198754";


        endButton.style.display = "none";


    }

    catch (error) {

        console.error("Telegram error:", error);


        status.textContent = "Sending failed. Click Retry to send again.";

        status.style.color = "#dc3545";


        endButton.disabled = false;

        endButton.textContent = "Retry";


        endButton.onclick = async function () {

            endButton.disabled = true;

            endButton.textContent = "Sending";

            await submitFinalReport();

        };

    }

}


// =============================================
// HTML ESCAPE
// =============================================

function escapeHTML(text) {

    return String(text).replace(/[&<>"']/g, function (char) {

        return {

            '&': '&amp;',

            '<': '&lt;',

            '>': '&gt;',

            '"': '&quot;',

            "'": '&#039;'

        }[char];

    });

}


// =============================================
// LOAD QUESTIONS ON PAGE LOAD
// =============================================

loadQuestionsAndAnswers();

</script>

</body>
</html>
